global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Services push OTLP metrics to /api/v1/otlp/v1/metrics rather than being scraped,
  # because Aspire assigns ports dynamically and there is no stable target to poll.
